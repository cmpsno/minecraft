name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:RELEASE_TAG -replace '[^A-Za-z0-9._-]', '-'
          } else {
            $version = "manual-$($env:GITHUB_SHA.Substring(0, 8))"
          }

          $packageName = "minecraft-windows-$version"
          $packageDirectory = Join-Path $env:RUNNER_TEMP $packageName
          New-Item -ItemType Directory -Path $packageDirectory | Out-Null
          Copy-Item "build\Release\Minecraft.exe" $packageDirectory
          Copy-Item README.md $packageDirectory
          Compress-Archive -Path (Join-Path $packageDirectory "*") -DestinationPath "$packageName.zip"
          "package_name=$packageName" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ${{ steps.package.outputs.package_name }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.package.outputs.package_name }}.zip
